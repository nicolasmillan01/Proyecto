<div class="container my-4">
  <h2 class="mb-4">Eventos Disponibles</h2>
  <div class="row">
    @for (event of events; track event.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-primary">{{ event.name }}</h5>
            <p class="card-text"><strong>Fecha:</strong> {{ event.date }}</p>
            <p class="card-text"><strong>Lugar:</strong> {{ event.location }}</p>
            <button class="btn btn-primary w-100" (click)="reservar(event.id)">Reservar Evento</button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
