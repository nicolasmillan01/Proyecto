<div class="container my-4">
  <h2 class="mb-4">Administrar Reservas Solicitadas (Agente)</h2>
  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead class="table-secondary">
        <tr>
          <th># Reserva</th>
          <th>ID Evento</th>
          <th>ID Cliente</th>
          <th>Estado Actual</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (res of reservations; track res.id) {
          <tr>
            <td>{{ res.id }}</td>
            <td>{{ res.eventId }}</td>
            <td>{{ res.clientId }}</td>
            <td>
              <span class="badge" [ngClass]="{
                'bg-success': res.status === 'Aprobada',
                'bg-warning text-dark': res.status === 'Pendiente',
                'bg-danger': res.status === 'Rechazada'
              }">{{ res.status }}</span>
            </td>
            <td>
              <button class="btn btn-sm btn-outline-success me-1" (click)="cambiarEstado(res, 'Aprobada')">Aprobar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="cambiarEstado(res, 'Rechazada')">Rechazar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
